[package]
name = "featherplayer-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }
libloading = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tiny-skia = "0.11"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
rfd = "0.14"
tray-icon = "0.21"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Memory", "Win32_System_DataExchange"] }

[target.'cfg(windows)'.build-dependencies]
# build.rs: puts pics\feather_app.ico into the exe (taskbar / Explorer / shortcut icon)
winresource = "0.1"

[profile.release]
opt-level = 2
