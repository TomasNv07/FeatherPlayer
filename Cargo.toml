[package]
name = "featherplayer-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }
libloading = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
rfd = "0.14"

[profile.release]
opt-level = 2
